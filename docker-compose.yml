      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=1
      - -Q
      - report-gen

  # Forensic Agentic AI — isolated from disk-build / rag-index
  worker-agent:
    cpus: "${FORENSIC_CPU_AGENT_CPUS:-0.25}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
