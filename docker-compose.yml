# Disk forensics product only. Android/iOS are independent products.
# Android: services/mobile-android/docker-compose.yml
# iOS:     services/mobile-ios/docker-compose.yml
# Legacy mobile migration only: services/mobile-extract/docker-compose.yml
# Vulnerabilities:   services/vuln/docker-compose.yml
# Dynamic Windows drive mounts are a Compose OVERRIDE, not an `include`.
# Windows startup/refresh scripts merge it with: -f docker-compose.drives.generated.yml

# Job files, models, and object storage live under AETHERIS_BACKUP_DIR
# (default ./backup). That folder is ordinary host storage, so it can be
# moved to another disk: stop the stack, move the folder, update the env path.
x-forensic-volumes: &forensic-volumes
  - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
  - type: bind
    source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
    target: /app/data

# Client-workstation evidence ("This computer" in the evidence picker). Each
# processing container mounts the examiner's read-only share on demand through
# FUSE at /client-evidence/<share>; nothing is copied to the server. Needs the
# FUSE device and the mount capability. Set CLIENT_EVIDENCE_ENABLED=false in
# .env to switch the feature off (the privileges are then unused).
x-client-evidence-fuse: &client-evidence-fuse
  devices:
    - /dev/fuse:/dev/fuse
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor:unconfined

# Shared GPU reservation (NVIDIA Container Toolkit / Docker Desktop GPU)
x-gpu: &gpu
  driver: nvidia
  count: 1
  capabilities: [gpu]

# Join the shared Postgres / Redis / MinIO / MailHog network.
x-common-net: &common-net
  networks:
    - default
    - aetheris-common

# V45.3 container lifecycle. Celery runs as PID 1 (entrypoint execvp); without an init
# process signals are not forwarded/reaped, and compose's default 10 s grace then
# SIGKILLs the worker mid-task. A child blocked in uninterruptible I/O (9p/gRPC-FUSE
# bind mount of G:\ evidence) or inside a CUDA call cannot be killed, the PID
# namespace never tears down and Docker reports
#   "cannot stop container: tried to kill container, but did not receive an exit event".
# tini + a real grace period + Celery cold shutdown (REMAP_SIGTERM) make stops
# deterministic; acks_late tasks are redelivered after restart.
x-worker-lifecycle: &worker-lifecycle
  init: true
  stop_signal: SIGTERM
  stop_grace_period: 120s

# Probe host room (CPU/RAM/GPU/thermal) then exec celery — see scripts/dynamic_perf_entrypoint.py
x-dynamic-entrypoint: &dynamic-entrypoint
  - python
  - /scripts/dynamic_perf_entrypoint.py

x-worker-env: &worker-env
  DATABASE_URL: postgresql+psycopg2://forensic:forensic@postgres:5432/forensic
  REDIS_URL: redis://redis:6379/0
  # V45.3: SIGTERM => cold shutdown (stop consuming, terminate children, exit) instead of
  # warm shutdown that waits for an hours-long extraction and then gets SIGKILLed.
  REMAP_SIGTERM: ${CELERY_REMAP_SIGTERM:-SIGQUIT}
  CELERY_SHUTDOWN_RELEASE_GPU: ${CELERY_SHUTDOWN_RELEASE_GPU:-true}
  RESOURCE_GOVERNOR_ENABLED: ${RESOURCE_GOVERNOR_ENABLED:-true}
  RESOURCE_GOVERNOR_REDIS_URL: ${RESOURCE_GOVERNOR_REDIS_URL:-redis://redis:6379/15}
  RESOURCE_GOVERNOR_GROUP: ${RESOURCE_GOVERNOR_GROUP:-aetheris-host}
  RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE: ${RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE:-false}
  RESOURCE_GOVERNOR_CPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_CPU_MAX_SLOTS:-2}
  RESOURCE_GOVERNOR_GPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_GPU_MAX_SLOTS:-4}
  CPU_SAFE_MODE_ENABLED: ${CPU_SAFE_MODE_ENABLED:-true}
  CPU_SAFE_TARGET_PCT: ${CPU_SAFE_TARGET_PCT:-50}
  CPU_NATIVE_THREADS: ${CPU_NATIVE_THREADS:-1}
  OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
  OMP_THREAD_LIMIT: ${OMP_THREAD_LIMIT:-1}
  MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
  OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
  NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
  TOKENIZERS_PARALLELISM: "false"
  GPU_RELEASE_MODEL_AFTER_TASK: ${GPU_RELEASE_MODEL_AFTER_TASK:-true}
  # V45: one extraction task runs main + flusher + stop-poller + heartbeat sessions.
  # The old 2+2 pool was fully consumed by those four, so the first shard thread that
  # needed a connection died with "QueuePool limit of size 2 overflow 2 reached".
  # Shard threads are now DB-free (extract_shard_v45); 4+8 leaves headroom for
  # phase-3 hand-offs. Budget: worker-disk 8 x 12 + worker-parse 6 x 12 < max_connections=200.
  DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-4}
  DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-8}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-90}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-forensic}
  HOST_EVIDENCE_ENABLED: ${HOST_EVIDENCE_ENABLED:-true}
  HOST_EVIDENCE_ROOT: ${HOST_EVIDENCE_ROOT:-}
  HOST_DRIVE_MAP: ${HOST_DRIVE_MAP:-}
  HOST_PATH_MAPPINGS: ${HOST_PATH_MAPPINGS:-}
  # Examiner PC USB bridge for Device Wizard (adb / libimobiledevice on host)
  HOST_DRIVE_HELPER_URL: ${HOST_DRIVE_HELPER_URL:-http://host.docker.internal:9876}
  DATA_ROOT: /app/data
  # Scratch files follow the job-data bind mount instead of the container layer
  # inside DockerDesktopWSL.
  TMPDIR: /app/data/tmp
  TMP: /app/data/tmp
  TEMP: /app/data/tmp
  # Disk/OCR/RAG workers hold DB sessions across long I/O — do not kill idle-in-tx.
  AETHERIS_WORKER: "1"
  IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "0"
  # Dynamic performance: retune concurrency/batch/thermal from live CPU/RAM/GPU room
  DYNAMIC_PERF_ENABLED: ${DYNAMIC_PERF_ENABLED:-true}
  DYNAMIC_PERF_FORCE: ${DYNAMIC_PERF_FORCE:-true}
  DYNAMIC_PERF_LOCK: ${DYNAMIC_PERF_LOCK:-FORENSIC_WORKER_CONCURRENCY,MAX_CONCURRENT_DISK_BUILDS}
  # E01: parallel readers on disjoint inode shards. Keep 2-4 so the host stays usable.
  # Values below are baselines; host_capacity overrides when DYNAMIC_PERF_FORCE=true.
  EXTRACT_DISK_WORKERS: ${EXTRACT_DISK_WORKERS:-3}
  EXTRACT_SHARD_COUNT: ${EXTRACT_SHARD_COUNT:-12}
  EXTRACT_UPLOAD_CONCURRENCY: ${EXTRACT_UPLOAD_CONCURRENCY:-3}
  EXTRACT_READ_SEMAPHORE: ${EXTRACT_READ_SEMAPHORE:-2}
  EXTRACT_READ_CHUNK_BYTES: ${EXTRACT_READ_CHUNK_BYTES:-8388608}
  EXTRACT_HDD_CHUNK_BYTES: ${EXTRACT_HDD_CHUNK_BYTES:-16777216}
  EXTRACT_SPOOL_MAX_BYTES: ${EXTRACT_SPOOL_MAX_BYTES:-134217728}
  MINIO_UPLOAD_PARALLEL: ${MINIO_UPLOAD_PARALLEL:-6}
  MINIO_UPLOAD_PART_MB: ${MINIO_UPLOAD_PART_MB:-64}
  EXTRACT_TARGET_GB: ${EXTRACT_TARGET_GB:-60}
