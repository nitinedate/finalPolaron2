services:
  # Ollama is installed on the host. No Ollama service or model pull runs in Docker.

  # NVIDIA CUDA runtime — stays up so GPU passthrough is live for OCR/RAG workers.
  neo4j:
    cpus: "${FORENSIC_CPU_NEO4J_CPUS:-0.5}"
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-forensic123}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    cpus: "${FORENSIC_CPU_API_CPUS:-1.0}"
    networks:
      default: {}
      aetheris-common:
        aliases:
          - forensic-api
    <<: [*common-net, *client-evidence-fuse]
    init: true
    stop_grace_period: 30s
    image: rag_new2-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
      pull: false
    env_file:
      - .env
    environment:
      <<: *worker-env
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-10}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Send invitations through the real SMTP server; NEVER fall back to MailHog.
      # MAIL_* variables are supplied by env_file: .env, including credentials.
      # Set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM in .env.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-superadmin@admin.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin@123456789}
    ports:
      # Loopback only — LAN OpenVAS must not treat FastAPI as a customer web app.
      # Host :8080 is often taken by unrelated stacks (e.g. htw-web); use 8083.
      - "127.0.0.1:8083:8080"
    # GPU visible so /api/health/capacity and thermal probes see the host NVIDIA device
    gpus: all
    depends_on:
      neo4j:
        condition: service_started
    volumes:
      - ${AETHERIS_BACKUP_DIR:-./backup}/huggingface:/root/.cache/huggingface
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts
      - ./migrations:/migrations
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 4G
    command: ["/scripts/start-api-container.sh", "app.main:app"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      # Forensic owns the shared PostgreSQL and applies firm migrations at boot;
      # if another stack's workers already hold locks, those ALTERs wait out
      # lock_timeout. 420s start_period + retries covers that cold start. Secondary
      # stacks skip boot migrations entirely (AETHERIS_SKIP_BOOT_MIGRATIONS=1).
      retries: 18
      start_period: 420s

  # Disk extract/parse — forensic product only (vuln scans live in services/vuln).
  worker-disk:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      # The /scratch bind mount below existed but extract_shard_v45 looked for
      # EXTRACT_SCRATCH_DIR, which was never set. Without this variable each
      # tar.zst part landed under TMPDIR=/app/data/tmp (the backup drive).
      # This points the worker at the dedicated host scratch mount instead.
      EXTRACT_SCRATCH_DIR: /scratch
    # CUDA device is visible; adaptive governor controls heavy GPU admission.
    gpus: all
    volumes:
      - ${AETHERIS_BACKUP_DIR:-./backup}/huggingface:/root/.cache/huggingface
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/uploads
        target: /app/data/uploads
      # V45: scratch for shard spool/parts. Point EXTRACT_SCRATCH_HOST_DIR at an NVMe/SSD
      # folder when the evidence drive is a USB HDD so reads and temp writes never share spindles.
      - type: bind
        source: ${EXTRACT_SCRATCH_HOST_DIR:-${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/scratch}
        target: /scratch
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 14G
          cpus: "${FORENSIC_CPU_DISK_CPUS:-2.5}"
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=8
      - --prefetch-multiplier=1
      - -Q
      # V45.2: inventory has its own lane; the disk pool is idle after extraction.
      - disk-build,disk-inventory

  # Dedicated parse pool so parse bursts cannot occupy every disk-build process.
  worker-parse:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
    gpus: all
    volumes:
      - ${AETHERIS_BACKUP_DIR:-./backup}/huggingface:/root/.cache/huggingface
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "${FORENSIC_CPU_PARSE_CPUS:-1.5}"
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${PARSE_CELERY_CONCURRENCY:-6}
      - --prefetch-multiplier=1
      - -Q
      - disk-parse,disk-inventory

  # CPU-only evidence quality triage. This sidecar inspects poor images/documents
  # and sampled video frames while native parsing continues. It never runs GPU OCR.
  worker-quality:
    cpus: "${FORENSIC_CPU_QUALITY_CPUS:-0.5}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      CUDA_VISIBLE_DEVICES: ""
      MOBILE_QUALITY_CPU_WORKERS: ${QUALITY_TRIAGE_CPU_WORKERS:-2}
      MOBILE_QUALITY_BATCH: ${QUALITY_TRIAGE_BATCH:-1200}
    gpus: []
    volumes:
      - ${AETHERIS_BACKUP_DIR:-./backup}/huggingface:/root/.cache/huggingface
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - ${HOST_EVIDENCE_PATH:-./evidence}:/evidence:ro
      - evidence_staging:/host/${EVIDENCE_STAGING_LETTER:-z}
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/job-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${QUALITY_TRIAGE_CELERY_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - -Q
      - quality-triage

  # GPU embeddings on rag-index. OCR runs on worker-ocr-gpu so both can overlap.
  worker-rag-gpu:
    cpus: "${FORENSIC_CPU_RAG_GPU_CPUS:-0.5}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cuda}
      RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-64}
      RAG_BATCH_SIZE_CAP: ${RAG_BATCH_SIZE_CAP:-64}
      RAG_CUDA_MEMORY_FRACTION: ${RAG_CUDA_MEMORY_FRACTION:-0.40}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_DEVICE: ${OCR_DEVICE:-cuda}
      OCR_CPU_WORKERS: ${OCR_CPU_WORKERS:-2}
      # Exclusive OCR may raise above RAG's tight cap after embedder unload.
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.62}
      GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
      GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
      GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
      GPU_THERMAL_POWER_LIMIT_W: ${GPU_THERMAL_POWER_LIMIT_W:-70}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 8G
    volumes:
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface
        target: /root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_started
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=1
      - --pool=solo
      - -Q
      - rag-index
      - --prefetch-multiplier=1

  # Isolated document-search lane. OCR can use the separately hosted Surya GPU
  # endpoint; Tesseract remains CPU-based. Does not consume disk-build slots.
  worker-ocr-documents:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      OCR_DOCUMENT_WORK_ROOT: ${OCR_DOCUMENT_WORK_ROOT:-/app/data/ocr_search}
      OCR_DOCUMENT_SOURCE_ROOTS: ${OCR_DOCUMENT_SOURCE_ROOTS:-/app/data/ocr_search/inbox}
      OCR_DOCUMENT_THREADS: ${OCR_DOCUMENT_THREADS:-1}
      OCR_ENGINE: ${OCR_ENGINE:-surya}
    volumes:
      - ./backend:/app
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: "${FORENSIC_CPU_OCR_DOCUMENTS_CPUS:-0.75}"
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=2
      - --prefetch-multiplier=1
      - -Q
      - ocr-documents

  # Dedicated OCR GPU worker — independent of RAG embeddings (two GPU slots).
  worker-ocr-gpu:
    cpus: "${FORENSIC_CPU_OCR_GPU_CPUS:-0.5}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
      OCR_ENABLED: "true"
      OCR_ENGINE: ${OCR_ENGINE:-surya}
      OCR_PREFER_FAST: "0"
      OCR_DEVICE: cuda
      OCR_GPU_ONLY: "true"
      OCR_PARALLEL_BUCKETS: "0"
      OCR_CPU_WORKERS: ${OCR_CPU_WORKERS:-2}
      OCR_CELERY_CONCURRENCY: "1"
      OCR_BATCH_LIMIT: ${OCR_BATCH_LIMIT:-64}
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.62}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
      GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
      GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
      GPU_THERMAL_POWER_LIMIT_W: ${GPU_THERMAL_POWER_LIMIT_W:-70}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
        limits:
          memory: 6G
    volumes:
      - ./backend:/app
      - ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data/remote-disk-staging:/remote-disk-staging
      - ./scripts:/scripts:ro
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/forensic-data
        target: /app/data
      - type: bind
        source: ${AETHERIS_BACKUP_DIR:-./backup}/huggingface
        target: /root/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy
    entrypoint: *dynamic-entrypoint
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=1
      - --pool=solo
      - --prefetch-multiplier=1
      - -Q
      - ocr

  worker-report:
    cpus: "${FORENSIC_CPU_REPORT_CPUS:-0.25}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: [*common-net, *worker-lifecycle, *client-evidence-fuse]
    image: rag_new2-api
    env_file:
      - .env
    environment:
      <<: *worker-env
